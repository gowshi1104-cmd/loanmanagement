spring.application.name=loan-management

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# =========================================================
# CASHFREE
# =========================================================

cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.base.url=https://sandbox.cashfree.com/pg
cashfree.api.version=2025-01-01

frontend.url=${FRONTEND_URL}

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=86400000

# =========================================================
# PASSWORD RESET
# =========================================================

password-reset.expiration-minutes=15

# =========================================================
# REMEMBER ME
# =========================================================

remember-me.expiration-days=30
session.expiration-hours=24

# =========================================================
# MAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true